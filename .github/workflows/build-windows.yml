name: build-windows-exe

on:
  workflow_dispatch:
    inputs:
      control_center_ref:
        description: 'arctic_route_control_center ref'
        required: true
        default: 'main'
      deps_ref:
        description: 'Ref for the six production packages'
        required: true
        default: 'research-validation-system'

permissions:
  contents: read

concurrency:
  group: build-windows-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Clone control center
        shell: bash
        env:
          CC_REF: ${{ inputs.control_center_ref }}
        run: |
          set -euo pipefail
          mkdir -p ws
          git -c core.autocrlf=false clone --depth 1 -b "$CC_REF" \
            https://github.com/alth-earth/arctic_route_control_center.git \
            ws/arctic_route_control_center

      - name: Clone six production packages
        shell: bash
        env:
          DEPS_REF: ${{ inputs.deps_ref }}
        run: |
          set -euo pipefail
          for r in arctic_route_contracts arctic_route_orchestrator \
                   work_package_a work_package_b work_package_c work_package_d; do
            git -c core.autocrlf=false clone --depth 1 -b "$DEPS_REF" \
              "https://github.com/alth-earth/$r.git" "ws/$r"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2

      - name: Create native ecCodes prefix
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\arctic-native"
          micromamba create -y -p $prefix -c conda-forge `
            python=3.13 'eccodes>=2.40,<3' libnetcdf hdf5

      - name: Provide ecCodes definitions
        shell: pwsh
        run: |
          # GH Windows pwsh: native 非零退出会污染步骤退出码，这里显式关闭并自行校验
          $PSNativeCommandUseErrorActionPreference = $false
          $prefix = "$env:RUNNER_TEMP\arctic-native"
          $target = "$prefix\Library\share\eccodes\definitions"
          $src = "$env:RUNNER_TEMP\eccodes-defs"

          if (-not (Test-Path $target)) {
            Write-Host "[A] 用 micromamba 拉取 linux-64 包（definitions 为平台无关文本）"
            $env:CONDA_OVERRIDE_LINUX = "5.15"
            $env:CONDA_OVERRIDE_GLIBC = "2.35"
            micromamba create -y -p $src --platform linux-64 -c conda-forge "eccodes=2.48.0" 2>&1 | Out-Host
            Write-Host "方案A退出码：$LASTEXITCODE"
          }

          if (-not (Test-Path "$src\share\eccodes\definitions")) {
            Write-Host "[B] 直接下载 .conda 并用 python zstandard 解包"
            $pkg = "$env:RUNNER_TEMP\eccodes.conda"
            Invoke-WebRequest -Uri "https://conda.anaconda.org/conda-forge/linux-64/eccodes-2.48.0-h5b33cc0_0.conda" -OutFile $pkg
            & "$prefix\python.exe" -m pip install --quiet zstandard
            & "$prefix\python.exe" -c 'import zipfile,io,tarfile,sys,zstandard; zf=zipfile.ZipFile(sys.argv[1]); n=[x for x in zf.namelist() if x.startswith("pkg-") and x.endswith(".tar.zst")][0]; d=zstandard.ZstdDecompressor().stream_reader(io.BytesIO(zf.read(n))).read(); tf=tarfile.open(fileobj=io.BytesIO(d)); ms=[m for m in tf.getmembers() if "share/eccodes/definitions" in m.name]; tf.extractall(sys.argv[2], members=ms); print("extracted", len(ms))' $pkg $src
          }

          if (Test-Path "$src\share\eccodes\definitions") {
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            # linux 包内含符号链接，Copy-Item 会 "Access denied"；robocopy 可容错跳过
            robocopy "$src\share\eccodes\definitions" $target /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
            $rc = $LASTEXITCODE
            # robocopy: >=16 为严重错误；8/9 表示部分文件失败（linux 符号链接导致），不影响 GRIB definitions
            Write-Host "robocopy 退出码：$rc"
            if ($rc -ge 16) { throw "robocopy 严重失败（$rc）" }
          }

          if (-not (Test-Path $target)) { throw "definitions 仍然缺失：$target" }

          $defCount = @(Get-ChildItem -Recurse -LiteralPath $target -Filter *.def -ErrorAction SilentlyContinue).Count
          Write-Host "definitions 文件数：$defCount"
          $missing = @()
          foreach ($f in @("boot.def", "grib1\boot.def", "grib2\boot.def")) {
            if (Test-Path (Join-Path $target $f)) { Write-Host "OK   $f" } else { $missing += $f; Write-Host "MISS $f" }
          }
          if ($missing.Count -gt 0) { throw "关键 definitions 缺失：$($missing -join ', ')" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Inspect ecCodes prefix layout
        continue-on-error: true
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\arctic-native"
          Write-Host "=== Library ==="
          Get-ChildItem -LiteralPath "$prefix\Library" -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "=== eccodes dlls ==="
          Get-ChildItem -LiteralPath "$prefix\Library\bin" -Filter "*eccodes*.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      - name: Build Windows onedir EXE
        shell: pwsh
        env:
          ARCTIC_ROUTE_ECCODES_PREFIX: ${{ runner.temp }}\arctic-native
        run: |
          $ws = (Resolve-Path ws).Path
          Set-Location ws\arctic_route_control_center
          # Viewer 数据制品为可选输入：不传 -ViewerRootPackage / -ReadyPackage，
          # 产物只含 UI 静态文件，Viewer 数据在运行时从数据根目录加载。
          .\packaging\windows\build-windows.ps1 -WorkspaceRoot $ws -Clean

      - name: Upload handoff artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arctic_Route_Control_Center-Windows-x86_64
          compression-level: 0
          if-no-files-found: error
          path: |
            ws/arctic_route_control_center/dist/arctic-route-control-center
            ws/arctic_route_control_center/release/Arctic_Route_Control_Center-Windows-x86_64.zip
            ws/arctic_route_control_center/release/Arctic_Route_Control_Center-Windows-x86_64.zip.sha256
            ws/arctic_route_control_center/release/arctic-route-control-center.exe.sha256
